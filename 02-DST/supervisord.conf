[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[supervisorctl]

[inet_http_server]
port = 127.0.0.1:9001

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:caves]
command=/usr/local/bin/dst_graceful_shard.sh caves
autostart=true
autorestart=false
redirect_stderr=true
stdout_logfile=/home/container/DoNotStarveTogether/config/server/Caves/server_log.txt
directory=/home/container/bin64
stopsignal=TERM
stopwaitsecs=90

[program:master]
command=/usr/local/bin/dst_graceful_shard.sh master
autostart=true
autorestart=false
redirect_stderr=true
stdout_logfile=/home/container/DoNotStarveTogether/config/server/Master/server_log.txt
directory=/home/container/bin64
stopsignal=TERM
stopwaitsecs=90